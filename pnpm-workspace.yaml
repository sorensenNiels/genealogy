packages:
  - "apps/*"
  - "packages/*"

# esbuild's postinstall links the platform binary; vitest and drizzle-kit are
# unusable without it. msgpackr-extract's postinstall compiles a native addon
# that speeds up msgpackr (a bullmq dependency, used to (de)serialize job
# data) — msgpackr falls back to a pure-JS implementation without it, so this
# is a perf-only build, not a functional requirement. Everything else stays
# blocked from running install scripts.
allowBuilds:
  # Pulled in by jspdf (optional dependency); its install script only prints
  # a donation banner, so it stays blocked.
  core-js: false
  esbuild: true
  msgpackr-extract: true

# Single source of truth for third-party versions. Every package depends on
# `catalog:` rather than a literal range, so React in apps/frontend can never
# drift from React in packages/ui. Bump a version here and the whole monorepo moves.
catalog:
  # --- toolchain ---
  # Not 7.x yet: TypeScript 7.0 ships the `tsc` executable only and drops the
  # programmatic compiler API, which the Nest CLI (`nest build`, `nest start`)
  # calls into. The API is expected back in 7.1 — bump this line then.
  typescript: 6.0.3
  turbo: 2.11.7
  oxlint: 1.87.0
  oxfmt: 0.72.0
  vitest: 5.0.1
  "@types/node": 26.6.4
  jsdom: 30.1.0
  "@testing-library/react": 16.3.3
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/user-event": 14.6.7
  "@react-aria/test-utils": 1.0.0-rc.1

  # --- api ---
  "@nestjs/common": 12.0.3
  "@nestjs/core": 12.0.3
  "@nestjs/platform-express": 12.0.3
  "@nestjs/config": 12.0.0
  "@nestjs/cli": 12.0.3
  "@nestjs/testing": 12.0.3
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  express: 5.2.0
  "@types/express": 5.0.6
  "@types/express-serve-static-core": 5.1.3
  "@types/qs": 6.15.1
  multer: 2.4.0
  "@types/multer": 2.2.0

  # --- trpc ---
  # @trpc/tanstack-react-query is gone with the old Vite SPA: apps/frontend's
  # server functions call apps/backend's tRPC router with the plain
  # @trpc/client vanilla client (server-side only, see
  # apps/frontend/src/server/trpc-proxy-client.ts).
  "@trpc/server": 11.19.0
  "@trpc/client": 11.19.0
  superjson: 2.2.6
  zod: 4.6.5

  # --- database ---
  drizzle-orm: 0.45.2
  drizzle-kit: 0.31.10
  pg: 8.23.0
  "@types/pg": 8.23.1

  # --- web ---
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.0
  "@vitejs/plugin-react": 6.1.1
  # @tanstack/router-plugin and @tanstack/router-cli were the old Vite SPA's
  # (plain TanStack Router) route codegen — apps/frontend's route tree is now
  # generated by @tanstack/react-start's own Vite plugin instead.
  "@tanstack/react-router": 1.170.38
  "@tanstack/react-start": 1.168.57
  "@tanstack/react-router-ssr-query": 1.167.3
  "@tanstack/react-query": 5.103.1
  "@tanstack/react-table": 9.2.4
  "@tanstack/react-form": 1.33.5
  # Devtools, development builds only (see __root.tsx): one TanStack Devtools
  # shell with the Query, Router and Form panels as plugins. All actively
  # released (Query 5.104.1 on 2026-10-02, Router 1.167.2 on 2026-09-13, the
  # shell 0.10.13 on 2026-09-23, Form 0.2.34 on 2026-08-11); the shell and the
  # Form panel are still 0.x. Query devtools pinned to match react-query.
  # Theme fonts (see "Themes" in TECH_STACK.md): self-hosted Fontsource
  # variable fonts, OFL-licensed; 5.3.0 released 2026-07-19 for all, the
  # fontsource/font-files repo pushed 2026-09. Imported in
  # apps/frontend/src/styles.css; keep in step with FONTS in @genealogy/core.
  "@fontsource-variable/inter": 5.3.0
  "@fontsource-variable/source-sans-3": 5.3.0
  "@fontsource-variable/nunito": 5.3.0
  "@fontsource-variable/work-sans": 5.3.0
  "@fontsource-variable/figtree": 5.3.0
  "@fontsource-variable/atkinson-hyperlegible-next": 5.3.0
  "@fontsource-variable/fraunces": 5.3.0
  "@fontsource-variable/literata": 5.3.0
  "@fontsource-variable/lora": 5.3.0
  "@fontsource-variable/source-serif-4": 5.3.0
  "@fontsource-variable/eb-garamond": 5.3.0
  "@fontsource-variable/playfair-display": 5.3.0
  "@tanstack/react-devtools": 0.10.13
  "@tanstack/react-query-devtools": 5.103.1
  "@tanstack/react-router-devtools": 1.167.2
  "@tanstack/react-form-devtools": 0.2.34

  # --- ui (shadcn/ui primitives) ---
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  # Moving from React Aria to Base UI component by component (see "shadcn/ui
  # on Base UI" in TECH_STACK.md); React Aria stays for what Base UI has no
  # equivalent of (drag-and-drop grid, drop zone, tag group, calendar).
  # Base UI: mui/base-ui is pushed daily; 1.8.0 rather than 1.9.0 (2026-10-09)
  # to stay outside minimumReleaseAge instead of excluding it.
  "@base-ui/react": 1.8.0
  react-aria-components: 1.21.1
  # shadcn's own class merger (github.com/shadcn-ui/cn, published by shadcn,
  # no dependencies, 0.4.0 on 2026-09-22) — what the base-* registry styles
  # import. Only the vendor files in packages/ui/src/components/ui use it;
  # our components keep lib/utils' cn.
  cn: 0.4.0
  # The enter/exit animation utilities (animate-in, fade-in-0, zoom-in-95…)
  # the shadcn styles assume. Pure CSS, no runtime. Last release 1.4.0 on
  # 2025-09-24 (repo last pushed 2026-02) — slow, but there's little to change;
  # if it's abandoned, its keyframes are small enough to copy into styles.css.
  tw-animate-css: 1.4.0
  "@internationalized/date": 3.12.4
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  lucide-react: 1.47.0
  # Person profile photo cropper (circular selection from an Immich photo) —
  # last published 2026-07-24, canary builds as recent as 2026-09-05, so
  # actively maintained. Its one runtime dependency is normalize-wheel.
  react-easy-crop: 6.2.3

  # --- i18n (see "Internationalization" in FEATURES.md) ---
  # Both checked before adding: i18next released 2026-09-03, react-i18next
  # released 2026-09-21 — actively maintained. No language-detector package:
  # the current language is account-preference-driven (see ProfileService),
  # not browser Accept-Language-driven.
  i18next: 26.4.2
  react-i18next: 17.0.15

  # --- markdown notes (see "Markdown notes" in TECH_STACK.md) ---
  # MDXEditor for the WYSIWYG editing side (Lexical-based, markdown in/out
  # natively) and react-markdown for read-only rendering elsewhere.
  "@mdxeditor/editor": 4.2.5
  react-markdown: 10.1.0

  # --- tree view (see "Tree view: topola" in TECH_STACK.md) ---
  # topola draws the genealogy charts (hourglass, relatives, ancestors,
  # descendants) as SVG via D3. It has no pan/zoom of its own, so d3-zoom
  # adds that, with d3-selection to attach it (topola already depends on
  # d3-selection 3). Checked 2026-10-08 per the "Recommending or adding a
  # library" rule: topola last published 2026-09-04 (v3.10.4), last commit
  # 2026-10-03, 17 open issues — active, but essentially one maintainer.
  # d3-zoom/d3-selection last published 2022: D3 considers them finished,
  # not abandoned, and they are among the most-used packages on npm.
  # React Flow + elkjs were removed in favour of these — see TECH_STACK.md.
  topola: 3.10.4
  d3-zoom: 3.0.0
  d3-selection: 3.0.0
  # Smooth pans (re-centring, find, minimap jumps). Already in the tree as a
  # topola dependency, same d3-selection; last published 2022 like the rest
  # of D3 — finished, not abandoned.
  d3-transition: 3.0.1
  # PDF export of the tree (the chart rendered to PNG, placed on a page the
  # size of the chart). Loaded with a dynamic import only when someone picks
  # PDF — it's large, and its optional dependencies (html2canvas, canvg)
  # come along. Checked 2026-10-09: v4.2.1 released 2026-03-17, last commit
  # 2026-09-30, ~31k stars, 113 open issues; MIT — actively maintained.
  jspdf: 4.2.1
  "@types/d3-zoom": 3.0.9
  "@types/d3-selection": 3.0.12
  "@types/d3-transition": 3.0.9

  # --- auth ---
  better-auth: 1.7.5

  # --- queues & mail (see "Long-running work: BullMQ + a shared Redis" in TECH_STACK.md) ---
  # ioredis pinned to a major satisfying bullmq's own peer range (>=5.0.0);
  # not bumped independently of a bullmq bump.
  bullmq: 6.3.9
  "@nestjs/bullmq": 12.0.0
  ioredis: 6.0.0
  # Both ship their own TypeScript types — no @types/* package for either.
  nodemailer: 10.0.11
  handlebars: 4.7.9

  # --- static family website (see "Static family website" in TECH_STACK.md) ---
  # Both vetted 2026-10-09 per the "Recommending or adding a library" rule.
  # fflate writes the zip, streaming (0.8.3 released 2026-07, last commit
  # 2026-05, ~3k stars; already in the lockfile via jspdf). micromark turns
  # notes into HTML — the parser react-markdown uses, so notes render the
  # same as in the app, and safe by default (raw HTML escaped, javascript:
  # links dropped). Last released 2026-09.
  fflate: 0.8.3
  micromark: 4.0.3

minimumReleaseAgeExclude:
  - "@tanstack/react-start-rsc@0.1.56"
  - "@tanstack/react-start@1.168.57"
  - "@tanstack/start-plugin-core@1.171.47"
  - "nodemailer@10.0.11"
