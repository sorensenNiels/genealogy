name: genealogy

services:
  db:
    build:
      context: postgres
      dockerfile: Dockerfile
    image: genealogy/postgres-age-postgis:18-1.8.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: genealogy
      POSTGRES_PASSWORD: genealogy
      POSTGRES_DB: genealogy
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # The host's path, not `./postgres`, when compose runs inside the dev
      # container: its `docker` drives the host daemon (docker-outside-of-
      # docker), which resolves bind mounts on the host, where
      # /workspaces/genealogy doesn't exist. Run on the host itself, the
      # variable is unset and this falls back to `.`.
      - ${LOCAL_WORKSPACE_FOLDER:-.}/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genealogy -d genealogy"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Backs apps/backend's BullMQ queues (see "Long-running work: BullMQ + a
  # shared Redis" in TECH_STACK.md) — a core, always-on service, like every
  # other service in this file.
  # Published on the host, like `db` above, so the devcontainer (a separate
  # container, reached via host.docker.internal — see devcontainer.json) can
  # reach it too.
  redis:
    container_name: genealogy-redis
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
