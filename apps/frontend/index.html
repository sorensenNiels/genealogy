<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genealogy</title>
    <script>
      // Mirrors packages/ui/src/hooks/use-theme.ts's resolution, applied
      // synchronously before any stylesheet paints so there's no flash of the
      // wrong theme. Keep the storage key in sync with that file by hand.
      (function () {
        var stored = localStorage.getItem("genealogy-theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
